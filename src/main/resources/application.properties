# Tên ứng dụng
spring.application.name=UniPath-api

# Cấu hình kết nối Database PostgreSQL (ĐÃ ĐỔI THÀNH postgres Ở CUỐI)
spring.datasource.url=jdbc:postgresql://localhost:5433/UniPath
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.deserialization.fail-on-unknown-properties=true

# Cấu hình Upload File (Hỗ trợ ảnh <= 10MB, video <= 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# =========================================================================
# Cấu hình Google OAuth 2.0 (Phase 2)
# =========================================================================
google.client-id=${GOOGLE_CLIENT_ID:unipath-test-client-id.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
google.jwks-uri=${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}
google.redirect-uri=${GOOGLE_REDIRECT_URI:postmessage}
google.allowed-origins=${GOOGLE_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
